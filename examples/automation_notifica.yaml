# Esempio / Example: notifica quando la puntata sta per iniziare.
# Usa l'entita' evento "Messa in onda" (controlla l'ID in Impostazioni -> Entita').
alias: UPAS - anticipazione di stasera
triggers:
  - trigger: state
    entity_id: event.un_posto_al_sole_messa_in_onda
    attribute: event_type
    to: episode_starting
actions:
  - action: notify.notify
    data:
      title: "Stasera a Un Posto al Sole"
      message: "{{ trigger.to_state.attributes.excerpt }}"
